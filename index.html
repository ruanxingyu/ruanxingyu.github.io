<!DOCTYPE html>
<html lang="zh" data-theme="natural">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="每日物理练习题 - 阮老师科学课堂">
    <title>每日一题 | 物理专题</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;700&family=Noto+Sans+SC:wght@300;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #4CAF50;
            --secondary-color: #C8E6C9;
            --accent-color: #8BC34A;
            --background-color: #E8F7E4;
            --text-color: #333;
            --light-text-color: #555;
            --divider-color: #B7DFB7;
            --card-width: min(90vw, 900px);
            --shadow-intensity: 0.1;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background-color: var(--background-color);
            font-family: 'Noto Sans SC', system-ui, sans-serif;
            color: var(--text-color);
            line-height: 1.6;
            transition: all 0.3s ease;
        }
        
        .card {
            width: var(--card-width);
            background: white;
            border-radius: 1.25rem;
            box-shadow: 0 1.25rem 2.5rem rgba(0,0,0,calc(var(--shadow-intensity) * 0.4));
            animation: fadeIn 0.6s cubic-bezier(0.22, 1, 0.36, 1);
            position: relative;
            overflow: hidden;
            margin: 20px;
        }
        
        .card-header {
            padding: 1.5rem;
            background: var(--secondary-color);
            position: relative;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
        }
        
        h1 {
            font-family: 'Noto Serif SC', serif;
            font-size: 2.5rem;
            margin: 0;
            color: var(--text-color);
            line-height: 1.2;
        }
        
        .subtitle {
            font-size: 1.5rem;
            font-weight: 400;
            color: var(--text-color);
            opacity: 0.9;
            position: relative;
            padding-left: 1.2rem;
            font-family: 'Noto Sans SC', system-ui, sans-serif;
            margin: 0;
        }
        
        .subtitle::before {
            content: "";
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            height: 60%;
            width: 3px;
            background: var(--accent-color);
        }
        
        .card-content {
            padding: 2rem;
            position: relative;
        }
        
        .problem-statement {
            font-family: 'Noto Serif SC', serif;
            font-size: 1.4rem;
            margin-bottom: 1.5rem;
            color: var(--text-color);
        }
        
        .divider {
            height: 1px;
            background: var(--divider-color);
            margin: 2rem 0;
        }
        
        .meta-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9rem;
            color: var(--light-text-color);
        }
        
        .theme-background {
            position: absolute;
            font-size: 10rem;
            opacity: 0.08;
            font-weight: 900;
            pointer-events: none;
            z-index: 0;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            letter-spacing: 0.5rem;
        }
        
        @media (max-width: 768px) {
            .card-header {
                flex-direction: column;
                align-items: flex-start;
            }
            
            h1 {
                font-size: 2rem;
            }
            
            .subtitle {
                font-size: 1.2rem;
                padding-left: 1rem;
            }
            
            .problem-statement {
                font-size: 1.2rem;
            }
        
            .theme-background {
                font-size: 8rem;
            }
        }
        
        @media (prefers-reduced-motion: reduce) {
            .card {
                animation: none;
            }
        }
    </style>
</head>

<body>
    <article class="card">
        <header class="card-header">
            <h1>每日一题</h1>
            <p class="subtitle">阮老师陪你一起每天进步</p>
        </header>

        <main class="card-content">
            <p class="problem-statement">
                有一斜面，高度为 H，斜面长度为 L，现用恒为 F 的力将一质量为 m 的物体从斜面下端推至顶端，求此过程中斜面对物体的摩擦力大小。（用字母表示）
            </p>

            <div class="divider" role="separator"></div>

            <footer class="meta-info">
                <span class="encouragement"></span>
                <time id="currentDate"></time>
            </footer>

            <div class="theme-background" aria-hidden="true">Physics</div>
        </main>
    </article>

    <script>

                text: '#263238',

                background: '#E0F7FA',

            },

        // 物理鼓励语库（52条）

            "波函数坍缩：观察决定现实，专注塑造未来",

            "哈密顿量：优化你的能量分配",
            "拉格朗日方程：找到最优雅的解决路径",
            "熵减过程：建立你的知识有序体系",
            "杨氏模量：培养抗压能力",
            "塞曼效应：在压力下展现独特光谱",
            "霍尔效应：在交叉领域找到自己的电势",
            "光电效应：突破临界频率才能激发潜能",
            "康普顿散射：每次碰撞都是进步的机会",
            "斯特藩定律：辐射强度与温度的四次方成正比",
            "瑞利判据：提高分辨能力才能看清本质",
            "马吕斯定律：用正确角度看待问题",
            "泊松亮斑：困难中也能发现意外之美"
        ];
        
        document.addEventListener('DOMContentLoaded', () => {
            applyRandomTheme();
            updateDateTime();
            showDailyEncouragement();
        });
        
        function applyRandomTheme() {
            const themeNames = Object.keys(themes);
            const randomTheme = themeNames[Math.floor(Math.random() * themeNames.length)];
            applyTheme(randomTheme);
        }
        
        function applyTheme(themeName) {
            const theme = themes[themeName];
            const root = document.documentElement;
            
            root.style.setProperty('--primary-color', theme.primary);
            root.style.setProperty('--secondary-color', theme.secondary);
            root.style.setProperty('--accent-color', theme.accent);
            root.style.setProperty('--background-color', theme.background);
            root.style.setProperty('--text-color', theme.text);
            root.style.setProperty('--light-text-color', theme.lightText);
            root.style.setProperty('--divider-color', theme.divider);
            root.dataset.theme = themeName;
        }
        
        function updateDateTime() {
            const options = { 
                year: 'numeric', 
                month: 'long', 
                day: 'numeric', 
                weekday: 'short' 
            };
            document.getElementById('currentDate').textContent = 
                new Date().toLocaleDateString('zh-CN', options);
        }
        
        function showDailyEncouragement() {
            const element = document.querySelector('.encouragement');
            const shuffled = [...ENCOURAGEMENT_LIB].sort(() => Math.random() - 0.5);
            element.textContent = shuffled[0];
        }
    </script>
</body>

</html>
